spring.application.name=corporate-payments
server.port=8080

# MySQL connection (change username/password to match your MySQL install)
spring.datasource.url=jdbc:mysql://localhost:3306/corporate_payments?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=your_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSF
joinfaces.faces.project-stage=Development

# Session timeout
server.servlet.session.timeout=15m
