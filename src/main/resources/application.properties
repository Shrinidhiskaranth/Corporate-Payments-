spring.application.name=corporate-payments
server.port=8080

# MySQL connection (change username/password to match your MySQL install)
spring.datasource.url=jdbc:mysql://localhost:3306/corporate_payments_v6?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=your_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSF
joinfaces.faces.project-stage=Development

# Session timeout
server.servlet.session.timeout=15m

# Application settings
# Create demo payment requests (in different statuses) on first start
app.seed.sample-requests=true
# SMS is simulated: the OTP is written to the log as [SIMULATED SMS] and, while this is true,
# also shown in the on-screen message so the demo works without a phone.
app.otp.show-on-screen=true
